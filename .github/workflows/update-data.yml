name: 每日更新基金数据

on:
  schedule:
    # 北京时间每天 21:00（UTC 13:00）自动运行
    - cron: '0 13 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行全量数据更新
        run: python3 run_all.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web_fund_data.json fund_extra_data.json fund_profiles.json fund_holdings.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "自动更新基金数据 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') CST"
            git push
          fi
